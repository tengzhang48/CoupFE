[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "coupfe"
version = "0.0.1"
description = "A compact finite-element scaffold for custom Abaqus and standalone elements."
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "CoupMech Lab" }]
license = "Apache-2.0 AND CC-BY-4.0 AND MIT"
license-files = [
    "LICENSE",
    "LICENSE-DOCS.md",
    "LICENSE-ABAQUS-UFL-EXAMPLES",
    "NOTICE",
]
keywords = ["finite-element-method", "multiphysics", "abaqus", "petsc", "mpi"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy>=1.21",
    "scipy>=1.7",
]

# The compiled-element runtime (coupfe.runtime) builds a Fortran element kernel
# on demand via numpy.f2py's meson backend. Element compilation needs NumPy >= 1.26,
# a compatible Fortran compiler, and the `meson` and `ninja` commands. The
# pure-Python operator contract (coupfe.operators / coupfe.assembly) needs none of them.
[project.optional-dependencies]
petsc = ["petsc", "petsc4py"]
runtime = ["numpy>=1.26", "meson", "ninja"]
# The build-time codegen (coupfe.codegen) turns a Python form into a Fortran UEL/UMAT; it
# needs sympy. This is not a runtime dependency: coupfe.runtime does not import
# coupfe.codegen.
codegen = ["sympy"]
# Optional numba acceleration for the 3D contact broad/narrow phase. CoupFE
# keeps a NumPy fallback, so this is not required for the base install.
performance = ["numba>=0.57"]
dev = ["pytest>=7"]

[project.urls]
Homepage = "https://tengzhang48.github.io/CoupFE/"
Repository = "https://github.com/tengzhang48/CoupFE.git"
Documentation = "https://github.com/tengzhang48/CoupFE/tree/main/docs"
Issues = "https://github.com/tengzhang48/CoupFE/issues"

[tool.setuptools.packages.find]
include = ["coupfe*"]

[tool.setuptools.package-data]
# Ship the vendored Fortran sources (element kernels plus native and UEL driver
# wrappers) so the runtime can compile them from an installed package.
"coupfe.runtime" = ["*.f90", "elements/*.for"]
# Ship the codegen Fortran templates (tensor_ops.for, etc.) so the generator works installed.
"coupfe.codegen.generators" = ["templates/*.for"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-m 'not slow'"
markers = [
    "slow: opt-in long-running benchmark or external-reproduction gate",
]
# A sign error in a generated operator must FAIL, not warn (the phase_flux sign trap).
filterwarnings = [
    "error::coupfe.codegen.core.verify.OperatorSignWarning",
]
